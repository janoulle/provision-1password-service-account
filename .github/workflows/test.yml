name: Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile Python sources
        run: >-
          python -m py_compile
          scripts/provision_service_account.py
          scripts/test_provision_service_account.py
      - name: Test provisioning logic
        run: python scripts/test_provision_service_account.py
      - name: Generate the synthetic plan
        run: >-
          python scripts/provision_service_account.py plan
          assets/service-account-plan.example.json
      - name: Compile the macOS Keychain helper
        run: >-
          swiftc scripts/store_macos_keychain_secret.swift
          -o /tmp/store-macos-keychain-secret
